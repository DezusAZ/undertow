# Docker's default json-file log driver has NO size limit: every container writes an
# ever-growing log until the disk fills and the whole box stops. That is one of the most
# common ways a long-running self-hosted stack dies, so cap every service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  vpntorrent:
    build: .
    image: vpntorrent
    container_name: vpntorrent
    logging: *default-logging
    cap_add:
      - NET_ADMIN          # needed to bring up WireGuard + killswitch
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1   # required for the wg-quick killswitch
      # Disable IPv6 entirely (WG here is v4-only) so there is no v6 stack to leak
      # your real IP through, regardless of ip6tables state. Verified accepted here.
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    mem_limit: 2g            # the heaviest service (libtorrent caches); cap so a spike
                             # can't OOM the box. Re-apply in apply-mem-caps.sh on recreate.
    environment:
      - PORT=8722          # web UI port (kept identical inside & out so the
                           # ZimaOS dashboard tile always resolves correctly)
      - VT_PASSWORD=${VT_PASSWORD:-}   # set in .env; if blank the app auto-generates a strong one (never a known default)
      - TMDB_API_KEY=${TMDB_API_KEY:-}   # <-- optional: a free TMDB API key enables poster art +
                           # descriptions in the Library tab. Get one at
                           # themoviedb.org/settings/api. Leave blank to skip.
      - TRANSCODER_URL=http://${TRANSCODER_IP:-172.24.9.2}:8723   # decoder sandbox
      - SEARX_URL=http://127.0.0.1:8080   # self-hosted SearXNG (shares this VPN namespace)
      - BITMAGNET_URL=http://127.0.0.1:3333   # self-hosted DHT crawler (torznab)
      - NEWZNAB_URL=${NEWZNAB_URL:-}       # Usenet indexer (NZBGeek Newznab) — set in .env
      - NZBGEEK_APIKEY=${NZBGEEK_APIKEY:-}
      - SAB_URL=${SAB_URL:-http://127.0.0.1:8085}   # SABnzbd download client
      - SAB_APIKEY=${SAB_APIKEY:-}
      # Origins allowed to POST (CSRF). Your reverse-proxy / front-door URL goes here,
      # comma-separated. Host and X-Forwarded-Host are always accepted automatically.
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
    ports:
      - "${WEB_PORT:-8722}:8722"   # web UI -> http://<host>:${WEB_PORT}
    volumes:
      - ./config:/config                              # drop proton.conf here
      - ${MEDIA_PATH}:/downloads     # 11TB drive: movies/tv/music/...
      - ${TRANSCODE_CACHE:-/DATA/transcode-cache}:/cache:ro   # serve prepared seekable MP4s
      - ./jackett-config:/jackett:ro                  # read Jackett's API key
    labels:
      icon: "data:image/svg+xml;base64,"
    restart: unless-stopped
    # GATE FOR THE SHARED NAMESPACE. The five siblings below run *inside* this
    # container's network namespace, so they must not exist until the kill-switch is
    # actually live — otherwise they egress via the bridge and get SNATed to the real
    # public IP (bitmagnet's DHT crawler starts 0.34s after its container does).
    # We test the LIVE firewall policy, deliberately NOT a marker file: a file would
    # survive an OOM kill and report "armed" for a container that never armed.
    healthcheck:
      test: ["CMD-SHELL", "iptables -S OUTPUT 2>/dev/null | head -1 | grep -qx -- '-P OUTPUT DROP'"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks:
      default: {}        # internet (for the VPN bootstrap) + the bridge for siblings
      sandbox:           # reach the decoder sandbox at 172.24.9.2 (no DNS needed)
        ipv4_address: ${VPNTORRENT_SANDBOX_IP:-172.24.9.3}   # pinned ≠ the sandbox's .2

  # Torrent search engine. Shares vpntorrent's network namespace, so ALL its
  # searches go out through the same Proton tunnel + killswitch. Not published to
  # the host — only the vpntorrent app reaches it (127.0.0.1:9117 inside the ns).
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: vpntorrent-jackett
    logging: *default-logging
    depends_on:
      vpntorrent:
        # wait for the kill-switch to be live, not merely for the container to exist
        condition: service_healthy
    network_mode: "service:vpntorrent"     # share the VPN namespace
    environment:
      - PUID=999
      - PGID=1000
      - TZ=${TZ:-America/Phoenix}
    volumes:
      - ./jackett-config:/config
      - ./jackett-resolv.conf:/etc/resolv.conf:ro   # force DNS through the tunnel
    restart: unless-stopped

  # Cloudflare / DDoS-Guard challenge solver (headless Chromium). Shares the VPN
  # namespace too, so the sites it visits also see the Proton exit IP, not yours.
  # Jackett is auto-pointed at it (http://127.0.0.1:8191) by vt.py so protected
  # indexers (1337x, torlock, glodls, ext, …) work. Chromium is RAM-hungry; it's
  # capped and runs with media disabled so it can't take the box down.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: vpntorrent-flaresolverr
    logging: *default-logging
    depends_on:
      vpntorrent:
        # wait for the kill-switch to be live, not merely for the container to exist
        condition: service_healthy
    network_mode: "service:vpntorrent"     # share the VPN namespace
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - HEADLESS=true
      - DISABLE_MEDIA=true     # skip image/media loads in Chromium -> less RAM/CPU
      - TZ=${TZ:-America/Phoenix}
    mem_limit: 1g              # isolate OOM to this container on the RAM-tight box
    volumes:
      - ./jackett-resolv.conf:/etc/resolv.conf:ro   # DNS through the tunnel
    restart: unless-stopped

  # Self-hosted metasearch node (SearXNG). This is the "Sources / Deep" transport:
  # it aggregates Google/Bing/Brave/DuckDuckGo/etc. and returns JSON, so the app can
  # run open-directory dorks (intitle:"index of" …) that public engines block when
  # scraped directly. Shares the VPN namespace so its upstream engine queries also
  # exit through Proton. Reached by the app at http://127.0.0.1:8080 (not published
  # to the host). JSON + limiter-off are set in ./searxng-config/settings.yml.
  searxng:
    image: searxng/searxng:latest
    container_name: vpntorrent-searxng
    logging: *default-logging
    depends_on:
      vpntorrent:
        # wait for the kill-switch to be live, not merely for the container to exist
        condition: service_healthy
    network_mode: "service:vpntorrent"     # share the VPN namespace
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
      - TZ=${TZ:-America/Phoenix}
    volumes:
      - ./searxng-config:/etc/searxng
      - ./jackett-resolv.conf:/etc/resolv.conf:ro   # DNS through the tunnel
    mem_limit: 1g            # capped on the RAM-tight box
    restart: unless-stopped

  # --- Self-hosted DHT crawler (bitmagnet) + its Postgres -------------------
  # Crawls the BitTorrent DHT directly, harvesting infohashes that live only in
  # the swarm — on no tracker site. Shares the VPN namespace, so ALL crawl traffic
  # exits through Proton and is killswitch-protected (fails closed if the VPN drops).
  # The app queries its Torznab endpoint at 127.0.0.1:3333. It WARMS UP over hours/
  # days as it discovers torrents (an empty DB returns little at first). Memory-capped
  # for the RAM-tight box — stop these two services if the box gets tight.
  bitmagnet-postgres:
    image: postgres:16-alpine
    container_name: vpntorrent-bitmagnet-pg
    logging: *default-logging
    # NOT in the VPN namespace: postgres has no external traffic (only bitmagnet talks
    # to it, locally), so it doesn't need the tunnel — and keeping it OUT of the shared
    # namespace means it can never be "orphaned" when vpntorrent restarts. It lives on
    # the internal sandbox net at a fixed IP; bitmagnet (in the VPN ns, also on sandbox)
    # reaches it there. This removes the stateful DB from the restart-fragile set.
    networks:
      sandbox:
        ipv4_address: ${BITMAGNET_PG_IP:-172.24.9.4}
    environment:
      - POSTGRES_PASSWORD=bitmagnet
      - POSTGRES_DB=bitmagnet
      - PGUSER=postgres
    volumes:
      - bitmagnet-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d bitmagnet -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      # WAL crash-recovery after a power loss can take a while on a spinning disk;
      # don't count that against the health budget (or bitmagnet's dependency gate
      # would fail the whole boot with no retry).
      start_period: 180s
    mem_limit: 640m
    shm_size: 256m
    restart: unless-stopped

  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:latest
    container_name: vpntorrent-bitmagnet
    logging: *default-logging
    depends_on:
      bitmagnet-postgres:
        condition: service_healthy
      vpntorrent:
        # was MISSING entirely: bitmagnet could start before vpntorrent existed, so its
        # DHT crawler announced from the bridge address = the operator's real IP
        condition: service_healthy
    network_mode: "service:vpntorrent"     # crawl exits through Proton
    environment:
      - POSTGRES_HOST=${BITMAGNET_PG_IP:-172.24.9.4}   # postgres on the sandbox net (not this ns)
      - POSTGRES_NAME=bitmagnet
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=bitmagnet
      - TZ=${TZ:-America/Phoenix}
    volumes:
      - ./jackett-resolv.conf:/etc/resolv.conf:ro   # DNS through the tunnel
    command: ["worker", "run", "--keys=http_server", "--keys=queue_server", "--keys=dht_crawler"]
    mem_limit: 1200m
    restart: unless-stopped

  # Usenet download client (SABnzbd). The "download pipe" for Usenet: the app sends
  # it an NZB, and it fetches the article parts from the Newshosting provider over
  # SSL, repairs (PAR2), unpacks, and drops the finished file into the shared library
  # folder — where ClamAV scans it and the sandbox player opens it, same as torrents.
  # Shares the VPN namespace so all Usenet traffic exits through Proton and is
  # killswitch-protected. Provider credentials live in ./sabnzbd-config (gitignored).
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: vpntorrent-sabnzbd
    logging: *default-logging
    depends_on:
      vpntorrent:
        # wait for the kill-switch to be live, not merely for the container to exist
        condition: service_healthy
    network_mode: "service:vpntorrent"     # share the VPN namespace (app reaches 127.0.0.1:8085)
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-America/Phoenix}
    volumes:
      - ./sabnzbd-config:/config
      - ${MEDIA_PATH}:/downloads
      - ./jackett-resolv.conf:/etc/resolv.conf:ro   # DNS through the tunnel
    mem_limit: 1g
    restart: unless-stopped

  # Malware scanner (ClamAV). Scans newly-finished downloads ON DEMAND (no
  # resident daemon — low RAM), quarantines threats + risky non-media files to
  # /downloads/.quarantine, and writes /config/clamav/results.json that the app
  # reads for the Library scan badges. It does its OWN scanning (the app can't
  # reach it — the VPN container's DNS is hijacked to the tunnel), so no app↔AV
  # network link is needed. Trusted component: runs as root to read/move files;
  # on the normal bridge so freshclam can update signatures.
  clamav:
    build: ./clamav
    image: vpntorrent-clamav:local
    container_name: vpntorrent-clamav
    logging: *default-logging
    user: "0:0"
    # The base image's healthcheck pings the clamd daemon, which we intentionally
    # don't run (on-demand clamscan keeps RAM low) — disable it so it's not "unhealthy".
    healthcheck:
      disable: true
    mem_limit: 2g            # clamscan loads the sig DB (~1.3G) only while scanning
    environment:
      - TZ=${TZ:-America/Phoenix}
      # flag  = scan + flag threats but KEEP them for you to review/decide (default)
      # quarantine = move threats into /downloads/.quarantine
      - QUARANTINE_ACTION=${QUARANTINE_ACTION:-flag}
    volumes:
      - ${MEDIA_PATH}:/downloads     # rw: to move threats to .quarantine
      - ./config:/config                              # write results.json the app reads
      - clamav-db:/var/lib/clamav                     # persist the signature DB
    restart: unless-stopped

  # Sandboxed media decoder. The app proxies /play here so ffmpeg never runs in
  # the privileged VPN container. Locked down hard: no capabilities, read-only
  # root, non-root, no-new-privileges, /downloads READ-ONLY, and on an INTERNAL
  # network with NO internet. A malicious media file that exploits a decoder bug
  # is trapped here — it can't reach the network, the VPN keys, or anything else.
  transcoder:
    image: vpntorrent          # reuse the main image (has ffmpeg + library.py)
    container_name: vpntorrent-transcoder
    logging: *default-logging
    depends_on:
      - vpntorrent
    # Override the image ENTRYPOINT (entrypoint.sh brings up WireGuard then execs
    # vt.py). Compose `command:` only replaces CMD, NOT ENTRYPOINT, so without this
    # the sandbox would run the VPN bootstrap + main app instead of the decoder.
    entrypoint: ["python3", "/app/transcoder.py"]
    command: []
    user: "65534:65534"        # nobody:nogroup
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 64
    mem_limit: 2g              # NVENC + a 4K prepare needs headroom
    # NOTE: hardware (NVENC) transcoding is OPTIONAL and lives in docker-compose.gpu.yml.
    # It is not declared here on purpose: a `deploy.resources.reservations.devices:
    # driver: nvidia` block makes `docker compose up` FAIL outright on any host without
    # the NVIDIA container runtime, which is most machines. CPU transcoding works
    # everywhere; install.sh detects an NVIDIA setup and layers the GPU overlay on.
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - SAVE_PATH=/downloads
      - CACHE_DIR=/cache
    volumes:
      - ${MEDIA_PATH}:/downloads:ro                        # READ-ONLY input
      - ${TRANSCODE_CACHE:-/DATA/transcode-cache}:/cache   # prepared seekable MP4s (rw)
    networks:
      sandbox:
        ipv4_address: ${TRANSCODER_IP:-172.24.9.2}
    restart: unless-stopped

  # Self-heal watchdog. Fixes the #1 restart hazard: the five network_mode:service
  # siblings are orphaned on a DEAD namespace if vpntorrent restarts alone (OOM/crash)
  # — Docker can't even restart them (they're bound to the old, gone sandbox id), so
  # nothing re-attaches them. This tiny sidecar runs undertow-heal.sh every 60s and
  # compose-RECREATES any orphaned/exited sibling so it rejoins the live namespace
  # (a plain `docker restart` cannot — that was the old, broken heal). It has the
  # compose plugin (docker:27-cli) and the project is bind-mounted at its REAL host
  # path so compose's ./config relative binds resolve on the host daemon.
  # Needs the Docker socket (root-equivalent — standard for this pattern).
  watchdog:
    image: docker:27-cli
    container_name: vpntorrent-watchdog
    logging: *default-logging
    restart: unless-stopped
    environment:
      # the endpoint the GPU-health flag certifies — must equal the app's ai.json url so
      # the flag can't certify one Ollama while the app calls a different (CPU) one.
      # Empty by default: the local-AI feature is optional, and a hardcoded LAN address
      # would be wrong (and would leak the packager's network layout) on anyone else's box.
      OLLAMA_URL: ${OLLAMA_URL:-}
      # so the heal script finds the project without a compiled-in path
      COMPOSE_DIR: ${UNDERTOW_DIR:-${PWD}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # identity mount: same path inside as on the host, so `docker compose` bind
      # paths (./jackett-config, ...) resolve to real host dirs for the daemon. Writable
      # so the GPU fail-safe can publish config/gpu_health.json for the app to read.
      # ${PWD} fallback keeps this working wherever the project is installed — a
      # hardcoded path silently broke the watchdog on any other machine.
      - ${UNDERTOW_DIR:-${PWD}}:${UNDERTOW_DIR:-${PWD}}
    working_dir: ${UNDERTOW_DIR:-${PWD}}
    mem_limit: 128m
    entrypoint: ["/bin/sh", "-c", "echo '[watchdog] started'; while true; do sh \"$${COMPOSE_DIR}/undertow-heal.sh\" || true; sleep 15; done"]

# ZimaOS / CasaOS dashboard metadata (ignored by `docker compose`; read by the
# dashboard so the tile opens http://<hostname>:<port_map>). hostname is the
# Tailscale IP so the tile works when you're remote, matching the other apps.
x-casaos:
  architectures:
    - amd64
  main: vpntorrent
  # NOTE (2026-08-16): the vpntorrent container runs on the VPN network, so its published
  # port :8722 is only reachable via loopback (kernel DNAT over the Tailscale IP makes replies
  # route out the VPN and time out). The tile therefore points at a Tailscale-Serve front door
  # (https://<magicdns>:8723 -> 127.0.0.1:8722) instead of the raw IP. Do NOT revert to the IP.
  # Set CASAOS_HOSTNAME in .env to the address YOUR browser uses to reach this box
  # (a Tailscale MagicDNS name, a LAN IP, whatever). Left blank on a fresh install so
  # nobody inherits the packager's hostname.
  hostname: ${CASAOS_HOSTNAME:-}
  port_map: "8723"
  scheme: https
  index: /
  is_uncontrolled: false
  author: self
  developer: self
  category: Downloader
  store_app_id: vpntorrent
  icon: "data:image/svg+xml;base64,"
  title:
    custom: Undertow
    en_us: Undertow
  tagline:
    en_us: Beneath the surface — private, VPN-locked file discovery
  description:
    en_us: Undertow searches where others can't — 99 torrent indexers, a self-hosted DHT crawler, open-directory crawling, papers, books, media and more, from one interface. VPN-locked and malware-scanned; nothing leaves the tunnel.

networks:
  # Isolated network for the decoder sandbox. `internal: true` => NO internet
  # (and no gateway, so joining it doesn't add a default route that could break
  # the wg killswitch). Subnet is inside 172.16/12, which the entrypoint already
  # routes via the main table, so vpntorrent can still reach the transcoder (172.24.9.2).
  sandbox:
    internal: true
    ipam:
      config:
        - subnet: ${SANDBOX_SUBNET:-172.24.9.0/24}

volumes:
  clamav-db:        # persists the ClamAV signature DB across restarts
  bitmagnet-pg:     # persists the bitmagnet DHT-crawl database
